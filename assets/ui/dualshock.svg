<svg xmlns="http://www.w3.org/2000/svg" width="128" height="88" viewBox="0 0 128 88">
  <!-- the PS1's DualShock (SCPH-1200 grey), seen from above: OpenDash's drawing for the key configuration -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c9cc"/>
      <stop offset="1" stop-color="#a9a9ad"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6e74"/>
      <stop offset="1" stop-color="#55555a"/>
    </linearGradient>
  </defs>
  <!-- the shoulder buttons (L2 / R2 behind, L1 / R1 in front) -->
  <rect x="17" y="7" width="26" height="7" rx="3" fill="#8d8d92"/>
  <rect x="85" y="7" width="26" height="7" rx="3" fill="#8d8d92"/>
  <rect x="15" y="11" width="28" height="7" rx="3" fill="#b4b4b8" stroke="#7a7a80" stroke-width="0.6"/>
  <rect x="85" y="11" width="28" height="7" rx="3" fill="#b4b4b8" stroke="#7a7a80" stroke-width="0.6"/>
  <!-- the body and its grips -->
  <path fill="url(#body)" stroke="#7a7a80" stroke-width="0.8"
        d="M30 15 C38 13 50 14 64 14 C78 14 90 13 98 15 C110 17 118 24 121 36 C124 48 125 62 124 74
           C123 82 119 86 113 86 C107 86 103 82 99 75 C95 68 92 63 87 61 L41 61 C36 63 33 68 29 75
           C25 82 21 86 15 86 C9 86 5 82 4 74 C3 62 4 48 7 36 C10 24 18 17 30 15 Z"/>
  <!-- the d-pad well and the d-pad -->
  <circle cx="27" cy="37" r="13" fill="#b2b2b6" stroke="#8e8e93" stroke-width="0.6"/>
  <!-- the PS1's d-pad: four separate arrow keys pointing at the centre -->
  <path fill="url(#dark)" d="M24.2 26.5 h5.6 v6.2 l-2.8 2.6 l-2.8 -2.6 Z"/>
  <path fill="url(#dark)" d="M24.2 47.5 h5.6 v-6.2 l-2.8 -2.6 l-2.8 2.6 Z"/>
  <path fill="url(#dark)" d="M16.5 34.2 v5.6 h6.2 l2.6 -2.8 l-2.6 -2.8 Z"/>
  <path fill="url(#dark)" d="M37.5 34.2 v5.6 h-6.2 l-2.6 -2.8 l2.6 -2.8 Z"/>
  <path fill="#3a3a3f" d="M27 28 l1.4 2 h-2.8 Z M27 46 l1.4 -2 h-2.8 Z M18 37 l2 -1.4 v2.8 Z M36 37 l-2 -1.4 v2.8 Z"/>
  <!-- the face buttons' well and the four buttons -->
  <circle cx="101" cy="37" r="15" fill="#b2b2b6" stroke="#8e8e93" stroke-width="0.6"/>
  <circle cx="101" cy="27.5" r="4.6" fill="url(#dark)"/>
  <circle cx="110.5" cy="37" r="4.6" fill="url(#dark)"/>
  <circle cx="101" cy="46.5" r="4.6" fill="url(#dark)"/>
  <circle cx="91.5" cy="37" r="4.6" fill="url(#dark)"/>
  <path fill="none" stroke="#3fd9a6" stroke-width="0.9" stroke-linejoin="round" d="M101 25.2 l2.3 3.9 h-4.6 Z"/>
  <circle cx="110.5" cy="37" r="2.3" fill="none" stroke="#ff5f6d" stroke-width="0.9"/>
  <path fill="none" stroke="#7d9cff" stroke-width="0.9" stroke-linecap="round" d="M99.2 44.7 l3.6 3.6 M102.8 44.7 l-3.6 3.6"/>
  <rect x="89.6" y="35.1" width="3.8" height="3.8" fill="none" stroke="#ff7fd1" stroke-width="0.9"/>
  <!-- SELECT, START, the ANALOG button and its light -->
  <rect x="50" y="34" width="8" height="3.4" rx="1.7" fill="url(#dark)"/>
  <path fill="url(#dark)" d="M70 34 h7 l1.5 1.7 l-1.5 1.7 h-7 Z"/>
  <circle cx="64" cy="47" r="2.6" fill="#5b5b60"/>
  <circle cx="64" cy="41.6" r="1.1" fill="#d23a2e"/>
  <!-- the two sticks -->
  <circle cx="46" cy="55" r="9" fill="#8f8f94"/>
  <circle cx="46" cy="55" r="6.6" fill="#3e3e43"/>
  <circle cx="46" cy="55" r="4.4" fill="none" stroke="#56565c" stroke-width="0.8"/>
  <circle cx="82" cy="55" r="9" fill="#8f8f94"/>
  <circle cx="82" cy="55" r="6.6" fill="#3e3e43"/>
  <circle cx="82" cy="55" r="4.4" fill="none" stroke="#56565c" stroke-width="0.8"/>
</svg>
